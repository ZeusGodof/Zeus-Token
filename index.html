<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUS Token</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
color:white;
min-height:100vh;
position:relative;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url('zeus-lightning-background.gif') center/cover no-repeat;
opacity:.8;
z-index:-1;
}

header{
width:100%;
padding:20px 40px;
display:flex;
align-items:center;
justify-content:space-between;
position:relative;
}

.socials{
display:flex;
gap:15px;
}

.socials a{
color:white;
text-decoration:none;
font-size:22px;
}

.logo{
position:absolute;
left:50%;
transform:translateX(-50%);
font-size:32px;
font-weight:bold;
color:white;
text-decoration:none;
}

nav{
display:flex;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

.menu-btn{
display:none;
font-size:28px;
cursor:pointer;
}

.hero{
min-height:75vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px 20px;
}

.token-wrapper{
animation:float 6s ease-in-out infinite;
}

.token-wrapper img{
width:220px;
max-width:70vw;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-15px)}
}

.hero h1{
font-size:42px;
margin:25px 0 15px;
}

.hero p{
max-width:700px;
line-height:1.7;
font-size:18px;
}

.btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
background:rgba(0,0,0,.65);
border:1px solid white;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

.buy-section{
text-align:center;
padding:30px 20px 60px;
}

.buy-button{
display:inline-block;
padding:16px 30px;
background:rgba(0,0,0,.7);
border:2px solid white;
border-radius:12px;
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

footer{
text-align:center;
padding:25px;
}

@media(max-width:768px){

header{
padding:20px;
}

nav{
display:none;
position:absolute;
top:70px;
right:20px;
flex-direction:column;
background:rgba(0,0,0,.9);
padding:20px;
border-radius:10px;
z-index:10;
}

nav.active{
display:flex;
}

.menu-btn{
display:block;
}

.logo{
font-size:26px;
}

.hero h1{
font-size:32px;
}

}
</style>
</head>

<body>

<header>

<div class="socials">
<a href="https://twitter.com/BNB_AICOIN" target="_blank">𝕏</a>
<a href="https://t.me/BNB_AICOIN" target="_blank">✈</a>
<a href="mailto:info@example.com">✉</a>
</div>

<a href="index.html" class="logo">ZEUS</a>

<nav>
<a href="index.html">Home</a>
<a href="features.html">Features</a>
<a href="how-to-buy.html">How to Buy</a>
<a href="launchpad.html">Launchpad</a>
<a href="about.html">About</a>
</nav>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

</header>

<section class="hero" id="hero">

<div class="token-wrapper">
<img src="zeus-token.gif" alt="ZEUS Token">
</div>

<h1>ZEUS – The Future of Digital Assets</h1>

<p>
ZEUS is a powerful community-driven digital asset built for the future.
Join the ZEUS ecosystem and become part of the journey.
</p>

<a href="#features" class="btn">Get Started</a>

</section>

<div class="buy-section">

<a href="https://example.com/buy-zeus" class="buy-button">
🛒 برای خرید کلیک کنید
</a>

</div>

<footer>
<p>© 2026 ZEUS Token. All Rights Reserved.</p>
</footer>

<script>
function toggleMenu(){
document.querySelector("nav").classList.toggle("active");
}

document.addEventListener('DOMContentLoaded',()=>{
document.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('keydown',e=>{
if(e.ctrlKey && ['u','s','c'].includes(e.key.toLowerCase())){
e.preventDefault();
}
});
});
</script>

</body>
</html>
