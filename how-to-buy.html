<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("zeus-lightning-background.gif") center/cover no-repeat;
    opacity: 0.8;
    z-index: -1;
}

header {
    width: 100%;
    padding: 20px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
}

.social {
    display: flex;
    gap: 15px;
    align-items: center;
}

.social a {
    color: white;
    text-decoration: none;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    transition: 0.3s;
}

.social a:hover {
    background: white;
    color: black;
    transform: scale(1.1);
}

.social svg {
    width: 20px;
    height: 20px;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: #aaa;
}

.menu-toggle {
    display: none;
    background: transparent;
    color: white;
    border: none;
    font-size: 30px;
    cursor: pointer;
}

main {
    min-height: calc(100vh - 150px);
    padding: 70px 20px;
    text-align: center;
}

h1 {
    font-size: 48px;
    margin-bottom: 40px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.topic-logo {
    width: 180px;
    height: 180px;
    margin: 0 auto 40px;
    animation: float 6s ease-in-out infinite;
}

.topic-logo svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.35));
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-15px);
    }
}

.content-box {
    max-width: 850px;
    margin: 0 auto;
    padding: 35px;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    backdrop-filter: blur(8px);
}

.content-box h2 {
    font-size: 30px;
    margin-bottom: 20px;
}

.content-box p {
    font-size: 18px;
    line-height: 1.8;
    color: #ddd;
}

.buy-section {
    margin-top: 40px;
}

.buy-button {
    display: inline-block;
    padding: 16px 30px;
    background: white;
    color: black;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    transition: 0.3s;
}

.buy-button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255,255,255,0.5);
}

footer {
    padding: 30px 5%;
    text-align: center;
    margin-top: 50px;
}

footer .social {
    justify-content: center;
    margin-bottom: 15px;
}

footer p {
    color: #aaa;
    font-size: 14px;
}

@media (max-width: 768px) {

    header {
        padding: 15px 5%;
    }

    .social {
        gap: 8px;
    }

    .social a {
        width: 34px;
        height: 34px;
    }

    .logo {
        font-size: 26px;
    }

    .menu-toggle {
        display: block;
    }

    nav {
        display: none;
        position: absolute;
        top: 75px;
        right: 5%;
        width: 200px;
        padding: 20px;
        background: rgba(0,0,0,0.95);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        flex-direction: column;
        gap: 18px;
    }

    nav.active {
        display: flex;
    }

    h1 {
        font-size: 36px;
    }

    .topic-logo {
        width: 140px;
        height: 140px;
    }

    .content-box {
        padding: 25px 20px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');

    menuToggle.addEventListener('click', () => {
        mainNav.classList.toggle('active');
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', e => {
        if (e.ctrlKey && ['u','s','c'].includes(e.key.toLowerCase())) {
            e.preventDefault();
        }
    });

});
